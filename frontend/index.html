<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5B4BE8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Furnigo Puantaj — çalışan, mesai, avans ve hakediş takibi." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Furnigo Puantaj</title>

    <style>
      /* React yüklenene kadar beyaz ekran yerine markalı açılış */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(900px 500px at 15% 0%, rgba(111, 102, 244, 0.16), transparent 60%),
          radial-gradient(800px 460px at 90% 10%, rgba(249, 143, 11, 0.12), transparent 55%),
          #f4f5fa;
        transition: opacity 0.35s ease;
      }
      #boot .ring {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 3px solid rgba(91, 75, 232, 0.2);
        border-top-color: #5b4be8;
        animation: boot-spin 0.75s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #root:not(:empty) + #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="ring"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
